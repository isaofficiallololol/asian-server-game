<!DOCTYPE html>
<html>
<head>
<title>Mini Games</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<nav class="navbar navbar-dark bg-secondary px-3">
  <span class="navbar-brand mb-0 h1">🎮 Mini Games</span>
  <input id="search" class="form-control w-auto" placeholder="Search..." onkeyup="searchGames()">
</nav>

<div class="container mt-4">
  <div class="row g-4" id="gameList">

    <div class="col-md-4 game-card" data-name="dont die from the blob">
      <div class="card h-100">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ-Tk2waFfqgzy52k8Fo27pWHd4OmBHMm5HFw&s" class="card-img-top">
        <div class="card-body">
          <h5 class="card-title">dont die from the blob</h5>
          <p class="card-text">avoid the blob and survive as long as you can as he chases you</p>
          <a href="blobio.html" class="btn btn-primary">play game</a>
        </div>
      </div>
    </div>

    <div class="col-md-4 game-card" data-name="geography dash">
      <div class="card h-100">
        <img src="https://images.twinkl.co.uk/tw1n/image/private/t_630/u/ux/ks2-earth_ver_1.png" class="card-img-top">
        <div class="card-body">
          <h5 class="card-title">geography dash</h5>
          <p class="card-text">basically geometry dash but with random countries and continents and without the shapes</p>
          <a href="#" class="btn btn-primary">COMING SOON😺</a>
        </div>
      </div>
    </div>

  </div>
</div>



<script>
function searchGames(){
  let input = document.getElementById("search").value.toLowerCase();
  let cards = document.querySelectorAll(".game-card");

  cards.forEach(card=>{
    let name = card.dataset.name.toLowerCase();
    card.style.display = name.includes(input) ? "block" : "none";
  });
}
</script>

</body>
</html>
